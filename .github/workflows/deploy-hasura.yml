name: Deploy Hasura Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hasura-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
      HASURA_GRAPHQL_ENDPOINT: ${{ vars.HASURA_GRAPHQL_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Hasura CLI
        run: curl -L https://github.com/hasura/graphql-engine/raw/stable/cli/get.sh | bash

      - name: Apply database migrations
        run: >-
          hasura migrate apply
          --database-name default
          --project hasura
          --endpoint "$HASURA_GRAPHQL_ENDPOINT"
          --admin-secret "$HASURA_GRAPHQL_ADMIN_SECRET"

      - name: Apply Hasura metadata
        run: >-
          hasura metadata apply
          --project hasura
          --endpoint "$HASURA_GRAPHQL_ENDPOINT"
          --admin-secret "$HASURA_GRAPHQL_ADMIN_SECRET"

      - name: Verify Hasura metadata
        run: >-
          hasura metadata inconsistency status
          --project hasura
          --endpoint "$HASURA_GRAPHQL_ENDPOINT"
          --admin-secret "$HASURA_GRAPHQL_ADMIN_SECRET"
