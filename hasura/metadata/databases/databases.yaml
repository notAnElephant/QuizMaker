- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: PG_DATABASE_URL
      isolation_level: read-committed
      use_prepared_statements: true
  tables:
    - table:
        schema: public
        name: answers
    - table:
        schema: public
        name: questions
      object_relationships:
        - name: quiz
          using:
            foreign_key_constraint_on: quiz_id
      insert_permissions:
        - role: user
          permission:
            check:
              quiz:
                owner_id:
                  _eq: X-Hasura-User-Id
            columns:
              - answer_media_source
              - answer_media_type
              - answer_options
              - category_name
              - correct_answer
              - points
              - question_id
              - question_text
              - question_type
              - quiz_id
              - reveal_answer
      select_permissions:
        - role: user
          permission:
            columns:
              - answer_media_source
              - answer_media_type
              - answer_options
              - category_name
              - correct_answer
              - points
              - question_id
              - question_text
              - question_type
              - quiz_id
              - reveal_answer
            filter:
              quiz:
                owner_id:
                  _eq: X-Hasura-User-Id
      update_permissions:
        - role: user
          permission:
            columns:
              - answer_media_source
              - answer_media_type
              - answer_options
              - category_name
              - correct_answer
              - points
              - question_text
              - question_type
              - reveal_answer
            filter:
              quiz:
                owner_id:
                  _eq: X-Hasura-User-Id
            check:
              quiz:
                owner_id:
                  _eq: X-Hasura-User-Id
      delete_permissions:
        - role: user
          permission:
            filter:
              quiz:
                owner_id:
                  _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: quiz_plays
      insert_permissions:
        - role: user
          permission:
            check:
              user_id:
                _eq: X-Hasura-User-Id
            columns:
              - play_id
              - play_time
              - quiz_id
              - score
              - session_id
              - team_name
              - team_score
              - user_id
      select_permissions:
        - role: user
          permission:
            columns:
              - play_id
              - play_time
              - quiz_id
              - score
              - session_id
              - team_name
              - team_score
              - user_id
            filter:
              user_id:
                _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: quizzes
      insert_permissions:
        - role: user
          permission:
            check:
              owner_id:
                _eq: X-Hasura-User-Id
            columns:
              - background_image
              - background_mode
              - background_preset
              - created_at
              - description
              - owner_id
              - quiz_id
              - shared_user_ids
              - text_color
              - title
              - updated_at
      select_permissions:
        - role: user
          permission:
            columns:
              - background_image
              - background_mode
              - background_preset
              - created_at
              - description
              - owner_id
              - quiz_id
              - shared_user_ids
              - text_color
              - title
              - updated_at
            filter:
              owner_id:
                _eq: X-Hasura-User-Id
      update_permissions:
        - role: user
          permission:
            columns:
              - background_image
              - background_mode
              - background_preset
              - description
              - shared_user_ids
              - text_color
              - title
              - updated_at
            filter:
              owner_id:
                _eq: X-Hasura-User-Id
            check:
              owner_id:
                _eq: X-Hasura-User-Id
      delete_permissions:
        - role: user
          permission:
            filter:
              owner_id:
                _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: users
      insert_permissions:
        - role: user
          permission:
            check:
              user_id:
                _eq: X-Hasura-User-Id
            columns:
              - display_name
              - email
              - user_id
      select_permissions:
        - role: user
          permission:
            columns:
              - created_at
              - display_name
              - email
              - user_id
            filter:
              user_id:
                _eq: X-Hasura-User-Id
      update_permissions:
        - role: user
          permission:
            columns:
              - display_name
              - email
            filter:
              user_id:
                _eq: X-Hasura-User-Id
            check:
              user_id:
                _eq: X-Hasura-User-Id
